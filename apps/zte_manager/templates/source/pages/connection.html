<section id="page-connection" class="page active">
                <div class="login-layout">

                    <aside class="login-hero am-connect-story am-inventory-panel" aria-label="Equipamentos registrados">
                        <div class="am-inventory-header">
                            <div>
                                <span class="section-kicker">ACESSO RÁPIDO</span>
                                <h2>Seus <em>equipamentos.</em></h2>
                                <p>Selecione uma ONT do inventário local ou informe outro endereço.</p>
                            </div>
                            <button id="connectionNewTarget" class="am-inventory-new" type="button" title="Adicionar outra ONT" aria-label="Informar novo equipamento">
                                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                            </button>
                        </div>
                        <label class="am-inventory-search" for="connectionInventorySearch">
                            <span class="material-symbols-outlined" aria-hidden="true">search</span>
                            <input id="connectionInventorySearch" type="search" placeholder="Pesquisar por modelo ou IP" autocomplete="off">
                        </label>
                        <div id="connectionInventoryList" class="am-inventory-list" aria-live="polite" aria-busy="false">
                            <p class="am-inventory-empty">Consultando equipamentos registrados...</p>
                        </div>
                        <div class="am-inventory-footer">
                            <span id="connectionInventoryCount">Inventário local</span>
                            <span class="material-symbols-outlined" aria-hidden="true">router</span>
                        </div>
                    </aside>

                    <div class="panel login-panel">
                        <div class="panel-heading">
                            <div class="heading-icon"><span class="material-symbols-outlined">router</span></div>
                            <div>
                                <span class="section-kicker">NOVA SESSÃO</span>
                                <h3>Acesso à ONT</h3>
                                <p>Use as credenciais administrativas do equipamento.</p>
                            </div>
                        </div>

                        <form id="connectionForm" class="form-stack">
                            <div class="field-grid two">
                                <label class="field">
                                    <span>IP / HOST</span>
                                    <input id="zteIp" type="text" placeholder="100.64.230.64:6080" autocomplete="off" required>
                                </label>

                                <label class="field">
                                    <span>ATENDENTE</span>
                                    <input id="attendantName" type="text" placeholder="marinaldo" autocomplete="off" required>
                                </label>
                            </div>

                            <label class="field">
                                <span>USUÁRIO DA ONT</span>
                                <input id="zteUsername" type="text" placeholder="admin" autocomplete="username" required>
                            </label>

                            <label class="field">
                                <span>SENHA DA ONT</span>
                                <div class="password-control">
                                    <input id="ztePassword" type="password" placeholder="Senha" autocomplete="current-password" required>
                                    <button id="togglePassword" type="button">Mostrar</button>
                                </div>
                            </label>

                            <label class="field">
                                <span>MODELO (OPCIONAL)</span>
                                <select id="zteModelHint">
                                    <option value="">Detectar automaticamente</option>
                                    <option value="F6640">F6640</option>
                                    <option value="F6645P">F6645P</option>
                                    <option value="F680">F680</option>
                                    <option value="F6600P">F6600P</option>
                                    <option value="F8748">F8748</option>
                                    <option value="F670L">F670L</option>
                                    <option value="F6201B">F6201B (perfil experimental, somente leitura)</option>
                                    <option value="EG8041X7-10">Huawei EG8041X7-10 (IPv4 Filtering validado)</option>
                                    <option value="H169A">H169A</option>
                                    <option value="H2640">H2640</option>
                                    <option value="H288A">H288A</option>
                                    <option value="H388X">H388X</option>
                                    <option value="H3600P">H3600P</option>
                                    <option value="H3640">H3640</option>
                                    <option value="H6645P">H6645P</option>
                                    <option value="H6745">H6745</option>
                                    <option value="E2631">E2631 (Vue: descoberta experimental)</option>
                                    <option value="SR7410">SR7410 (Vue: descoberta experimental)</option>
                                    <option value="SR7110">SR7110 (Vue: descoberta experimental)</option>
                                </select>
                                <small class="muted">Outros modelos usam descoberta de recursos em modo leitura. Vue ainda requer adaptador de login.</small>
                            </label>

                            <label class="check-row">
                                <input id="zteHttps" type="checkbox">
                                <span>Usar HTTPS neste equipamento</span>
                            </label>

                            <button id="connectButton" class="button primary wide" type="submit">
                                <span class="material-symbols-outlined">power</span>
                                Conectar ao equipamento
                            </button>
                        </form>

                        <div id="connectionResult" class="connection-result hidden"></div>
                    </div>
                </div>
            </section>
