name: feature-ci-multivendor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q apps config tests manage.py launcher.py tools/build_frontend_template.py

      - name: Verify modular template
        run: |
          python tools/build_frontend_template.py --check

      - name: Collect static
        run: |
          python manage.py collectstatic --no-tailwind

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          find apps/zte_manager/static/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run JavaScript tests
        run: |
          node --test tests/*.cjs

      - name: Verify neutral runtime semantics
        run: |
          ! grep -R -E 'zte:(page-open|session-changed)' apps/zte_manager/static/js
          ! grep -R -E 'ZTE Automatic|Gerenciamento de equipamentos ZTE'             config apps/zte_manager/templates/source apps/zte_manager/views launcher.py
