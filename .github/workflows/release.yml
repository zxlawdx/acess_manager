name: tagged-windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente para buildar/publicar (ex.: v0.4.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout da tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Build do aplicativo
        shell: cmd
        run: build.bat

      - name: Testes Python
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Validar JavaScript
        shell: pwsh
        run: node --check apps/zte_manager/static/js/app.js

      - name: Empacotar build
        shell: pwsh
        run: |
          $zip = "ZTEAutomatic-Windows-$env:RELEASE_TAG.zip"
          if (-not (Test-Path "dist\ZTEAutomatic\ZTEAutomatic.exe")) { throw "Executavel nao encontrado em dist\ZTEAutomatic\ZTEAutomatic.exe" }
          Compress-Archive -Path "dist\ZTEAutomatic" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publicar artifact do workflow
        uses: actions/upload-artifact@v4
        with:
          name: ZTEAutomatic-Windows-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_ZIP }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Criar ou atualizar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $env:RELEASE_TAG ja existe. Atualizando assets."
              gh release upload "$env:RELEASE_TAG" "$env:RELEASE_ZIP" "$env:RELEASE_ZIP.sha256" --clobber
          }
          else {
              Write-Host "Criando release $env:RELEASE_TAG."
              gh release create "$env:RELEASE_TAG" "$env:RELEASE_ZIP" "$env:RELEASE_ZIP.sha256" --title "ZTE Automatic $env:RELEASE_TAG" --generate-notes
          }
