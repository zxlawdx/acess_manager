name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests urllib3 cryptography pydantic

      - name: Compile Python
        run: python -m compileall -q apps config tests manage.py launcher.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check apps/zte_manager/static/js/app.js
          node --check apps/zte_manager/static/js/advanced.js
          node --check apps/zte_manager/static/js/support_diagnostics.js
