name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify pinned Vela CLI
        run: |
          python -c "import vela; assert vela.__version__ == '0.2.2', vela.__version__"
          python manage.py help | grep -F 'init-process:instalation'
          python manage.py buildapp --dry-run
          python -c "from vela.cli.build import linux_venv_info, legacy_pkg_resources_collect_args; assert 'system_site_packages' in linux_venv_info()"
          python -c "from vela.cli.build import BuildOptions, build_plan, launcher_source; from pathlib import Path; p=build_plan(Path.cwd(), BuildOptions(gui='qt6')); assert 'qtpy' in p['command']; assert 'webview.platforms.qt' in launcher_source('qt6')"

      - name: Compile Python
        run: python -m compileall -q apps config tests manage.py launcher.py tools/build_frontend_template.py

      - name: Verify modular frontend template is generated and current
        run: python tools/build_frontend_template.py --check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Bootstrapping and static assets smoke test
        run: |
          python manage.py collectstatic --no-tailwind
          python launcher.py --self-test
          test -f staticfiles/zte_manager/js/core/api_errors.js
          test -f staticfiles/zte_manager/js/features/history.js
          test -f staticfiles/zte_manager/js/features/connection_inventory.js
          test -f staticfiles/zte_manager/js/features/device_topology.js
          test -f staticfiles/zte_manager/js/features/firmware_inspector.js
          test -f staticfiles/zte_manager/css/components/topology.css
          test -f staticfiles/zte_manager/css/components/firmware_inspector.css
          test -f staticfiles/zte_manager/css/tangerine.css
          test -f staticfiles/zte_manager/css/tangerine_cards.css

      - name: Check JavaScript syntax
        run: |
          node --check apps/zte_manager/static/js/app.js
          node --check apps/zte_manager/static/js/advanced.js
          node --check apps/zte_manager/static/js/support_diagnostics.js
          node --check apps/zte_manager/static/js/desktop_clipboard.js
          node --check apps/zte_manager/static/js/management.js
          node --check apps/zte_manager/static/js/adaptive_firmware.js
          node --check apps/zte_manager/static/js/f6201b_editor.js
          node --check apps/zte_manager/static/js/neutral_theme.js
          node --check apps/zte_manager/static/js/core/api_errors.js
          node --check apps/zte_manager/static/js/workbench_tabs.js
          node --check apps/zte_manager/static/js/features/history.js
          node --test tests/test_history_view.cjs
          node --test tests/test_structured_forms.cjs
          node --check apps/zte_manager/static/js/features/connection_inventory.js
          node --check apps/zte_manager/static/js/features/device_topology.js
          node --check apps/zte_manager/static/js/features/firmware_inspector.js
          node --test tests/test_tangerine_feature_experience.cjs
          node --test tests/test_connection_inventory.cjs
          node --test tests/test_clients_workbench.cjs
          node --test tests/test_device_tr069_workflow.cjs
          node --test tests/test_management_tabs.cjs
          node --test tests/test_diagnostic_tabs.cjs
          node --check apps/zte_manager/static/js/tangerine_shell.js
          node --test tests/test_api_client_ui.cjs tests/test_advanced_workbench.cjs
          node --check apps/zte_manager/static/js/tangerine_forms.js
          node --test tests/test_tangerine_v2.cjs
          node --check apps/zte_manager/static/js/f6201b_workbench.js
          node --check apps/zte_manager/static/js/dhcp_module.js
          node --check apps/zte_manager/static/js/named_presets.js
          node --check apps/zte_manager/static/js/tr069_profiles.js
          node --check apps/zte_manager/static/js/adaptive_firmware.js

      - name: Verify native read-only diagnostics independent of write permissions
        run: node tests/test_native_readonly_diagnostics.cjs

      - name: Verify DOM-only inventory ES module and classic shim
        run: node tests/test_inventory_view.cjs

      - name: Verify desktop clipboard capabilities and safe fallback
        run: node tests/test_desktop_clipboard.cjs

      - name: Verify loading overlay behavior
        run: node tests/test_loading_overlay.cjs

      - name: Verify discovery bootstrap survives stalled capabilities
        run: node tests/test_discovery_bootstrap.cjs

      - name: Verify F6600P Advanced, visible diagnostic progress and Qt light popups
        run: |
          node tests/test_f6600p_advanced_ui.cjs
          node tests/test_f6600p_support_ui.cjs
          node --check apps/zte_manager/static/js/tangerine_shell.js
          node --test tests/test_tangerine_ui.cjs
          node tests/test_f6600p_light_popups.cjs
          node tests/test_tr069_preset_ui.cjs
          node --check apps/zte_manager/static/js/tr069_profiles.js
          node --check apps/zte_manager/static/js/named_presets.js

      - name: Verify ONT data and session restoration
        run: node tests/test_session_restore.cjs

      - name: Verify adaptive firmware UI and sanitized attendance
        run: node tests/test_adaptive_firmware.cjs

      - name: Verify native and experimental model UI isolation
        run: |
          node tests/test_model_ui_isolation.cjs
          node tests/test_native_ui_preserved.cjs
          node tests/test_classic_support_ui.cjs

      - name: Verify neutral theme and profile null guard
        run: node tests/test_neutral_theme.cjs

      - name: Verify Tangerine navigation, theme persistence and safe errors
        run: node --test tests/test_tangerine_ui.cjs

      - name: Verify workbench layout and model UI contracts
        run: node tests/test_brmodelo_workbench.cjs

      - name: Verify F6201B experimental profile UI
        run: node tests/test_f6201b_profile_ui.cjs

      - name: Verify read-only profile loading and manual channels
        run: node tests/test_readonly_profile_regression.cjs

      - name: Verify accessible neutral light theme across all legacy sections
        run: node tests/test_light_mode_refine.cjs

      - name: Verify captured full form strategy syntax and contracts
        run: |
          python -m py_compile apps/zte_manager/services/f6201b_full_forms.py
          python -m unittest tests.test_f6201b_full_forms -v

      - name: Verify DHCP and native diagnostics UI contracts
        run: node tests/test_dhcp_module_ui.cjs

      - name: Verify provider ACS and named profile UI integration
        run: node tests/test_tr069_preset_ui.cjs

      - name: Verify F6201B captured workbench and isolation
        run: node tests/test_f6201b_workbench_ui.cjs

  phase2-windows:
    name: Phase 2 contracts (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify Phase 2 session, inventory and desktop host contracts
        run: |
          python -m unittest tests.test_phase2_integration tests.test_runtime_device_contract tests.test_windows_compat tests.test_api_error_sanitization tests.test_api_error_policy tests.test_frontend_backend_contracts tests.test_f6600p_support_progress tests.test_f6600p_dhcp_encoded tests.test_tr069_named_presets -v
      - name: Verify clipboard browser selection never touches Windows Web APIs
        run: |
          node tests/test_desktop_clipboard.cjs
          node tests/test_native_readonly_diagnostics.cjs
          node tests/test_inventory_view.cjs
          node tests/test_f6600p_advanced_ui.cjs
          node tests/test_f6600p_support_ui.cjs
          node tests/test_f6600p_light_popups.cjs
