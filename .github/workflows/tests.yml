name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify pinned Vela CLI
        run: |
          python -c "import vela; assert vela.__version__ == '0.2.2', vela.__version__"
          python manage.py help | grep -F 'init-process:instalation'
          python manage.py buildapp --dry-run
          python -c "from vela.cli.build import linux_venv_info, legacy_pkg_resources_collect_args; assert 'system_site_packages' in linux_venv_info()"
          python -c "from vela.cli.build import BuildOptions, build_plan, launcher_source; from pathlib import Path; p=build_plan(Path.cwd(), BuildOptions(gui='qt6')); assert 'qtpy' in p['command']; assert 'webview.platforms.qt' in launcher_source('qt6')"

      - name: Compile Python
        run: python -m compileall -q apps config tests manage.py launcher.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check apps/zte_manager/static/js/app.js
          node --check apps/zte_manager/static/js/advanced.js
          node --check apps/zte_manager/static/js/support_diagnostics.js
          node --check apps/zte_manager/static/js/management.js
          node --check apps/zte_manager/static/js/adaptive_firmware.js
          node --check apps/zte_manager/static/js/f6201b_editor.js
          node --check apps/zte_manager/static/js/adaptive_firmware.js

      - name: Verify loading overlay behavior
        run: node tests/test_loading_overlay.cjs

      - name: Verify discovery bootstrap survives stalled capabilities
        run: node tests/test_discovery_bootstrap.cjs

      - name: Verify ONT data and session restoration
        run: node tests/test_session_restore.cjs

      - name: Verify adaptive firmware UI and sanitized attendance
        run: node tests/test_adaptive_firmware.cjs

      - name: Verify native and experimental model UI isolation
        run: node tests/test_model_ui_isolation.cjs
          node tests/test_native_ui_preserved.cjs
          node tests/test_classic_support_ui.cjs
