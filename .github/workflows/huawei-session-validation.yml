name: Huawei session validation

on:
  push:
    branches:
      - fix/huawei-session-state-audit
      - feat/huawei-eg8041x7-response-readback
      - fix/huawei-profile-deterministic-readback
  pull_request:
    paths:
      - "apps/zte_manager/infrastructure/huawei/**"
      - "apps/zte_manager/model/device_adapters/huawei.py"
      - "apps/zte_manager/services/device_service.py"
      - "apps/zte_manager/services/huawei_*.py"
      - "apps/zte_manager/services/profile_service.py"
      - "apps/zte_manager/api.py"
      - "apps/zte_manager/static/js/app.js"
      - "apps/zte_manager/static/js/frontend_bootstrap.js"
      - "apps/zte_manager/static/js/core/**"
      - "apps/zte_manager/static/js/components/**"
      - "apps/zte_manager/static/js/services/**"
      - "apps/zte_manager/static/js/management/**"
      - "apps/zte_manager/static/js/advanced/**"
      - "apps/zte_manager/static/js/advanced.js"
      - "apps/zte_manager/static/js/features/firmware_inspector.js"
      - "apps/zte_manager/static/js/features/device_topology.js"
      - "apps/zte_manager/static/js/tr069_profiles.js"
      - "apps/zte_manager/static/css/tangerine_forms.css"
      - "tests/test_frontend_core.mjs"
      - "tests/test_frontend_capability_policy.mjs"
      - "tests/test_frontend_feature_modules.mjs"
      - "tests/test_huawei*"
      - "tests/test_profile*"
      - "tests/test_multivendor_runtime_regressions.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python syntax
        run: |
          python -m py_compile \
            apps/zte_manager/infrastructure/huawei/client.py \
            apps/zte_manager/infrastructure/huawei/response.py \
            apps/zte_manager/services/huawei_service.py \
            apps/zte_manager/services/huawei_eg8041x7_runtime.py \
            apps/zte_manager/services/huawei_captured_features.py \
            apps/zte_manager/services/huawei_mapped_surface.py \
            apps/zte_manager/services/huawei_ipv4_filter_service.py \
            apps/zte_manager/services/profile_service.py \
            apps/zte_manager/services/device_service.py \
            apps/zte_manager/model/device_adapters/huawei.py \
            apps/zte_manager/api.py

      - name: JavaScript syntax
        run: |
          node --check apps/zte_manager/static/js/app.js
          node --check apps/zte_manager/static/js/core/api_errors.js
          node --input-type=module --check < apps/zte_manager/static/js/frontend_bootstrap.js
          node --input-type=module --check < apps/zte_manager/static/js/core/request_state.js
          node --input-type=module --check < apps/zte_manager/static/js/core/api_client.js
          node --input-type=module --check < apps/zte_manager/static/js/core/bootstrap.js
          node --input-type=module --check < apps/zte_manager/static/js/core/session_state.js
          node --input-type=module --check < apps/zte_manager/static/js/core/device_state.js
          node --input-type=module --check < apps/zte_manager/static/js/core/capability_policy.js
          node --input-type=module --check < apps/zte_manager/static/js/components/loading_feedback.js
          node --input-type=module --check < apps/zte_manager/static/js/services/device_api.js
          node --input-type=module --check < apps/zte_manager/static/js/services/management_api.js
          node --input-type=module --check < apps/zte_manager/static/js/management/legacy_bridge.js
          node --input-type=module --check < apps/zte_manager/static/js/management/inventory_view.js
          node --input-type=module --check < apps/zte_manager/static/js/advanced/wifi_radio_fields.js
          node --check apps/zte_manager/static/js/advanced.js
          node --check apps/zte_manager/static/js/features/firmware_inspector.js
          node --check apps/zte_manager/static/js/features/device_topology.js
          node --check apps/zte_manager/static/js/tr069_profiles.js

      - name: Huawei backend regressions
        run: |
          python -m unittest \
            tests.test_profile_repository \
            tests.test_huawei_session_snapshot \
            tests.test_huawei_captured_features \
            tests.test_huawei_mapped_surface \
            tests.test_huawei_response_protocol \
            tests.test_huawei_eg8041x7_runtime \
            tests.test_huawei_dns_physical_state \
            tests.test_huawei_diagnostics \
            tests.test_huawei_provider_architecture \
            tests.test_huawei_ipv4_filter \
            tests.test_multivendor_runtime_regressions

      - name: Frontend core regressions
        run: |
          node --test \
            tests/test_frontend_core.mjs \
            tests/test_frontend_capability_policy.mjs \
            tests/test_frontend_feature_modules.mjs

      - name: Huawei UI regressions
        run: |
          node --test \
            tests/test_huawei_navigation_snapshot.cjs \
            tests/test_profile_error_contract.cjs
