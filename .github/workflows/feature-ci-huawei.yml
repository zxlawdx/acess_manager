name: feature-ci-huawei

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q apps config tests manage.py launcher.py tools/build_frontend_template.py

      - name: Verify modular Vela template
        run: |
          python tools/build_frontend_template.py --check

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check apps/zte_manager/static/js/app.js
          node --check apps/zte_manager/static/js/advanced.js
          node --check apps/zte_manager/static/js/support_diagnostics.js
          node --check apps/zte_manager/static/js/features/history.js

      - name: Run JavaScript tests
        run: |
          node --test tests/*.cjs
